services:
  nginx:
    image: nginx:latest
    container_name: pc-nginx
    restart: always
    networks:
      - dbnet
    ports:
      - "80:8080"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - photo-contest

  photo-contest:
    build: .
    image: photo-contest
    container_name: pc-aiohttp
    restart: always
    command: > 
      gunicorn app.web.gunicorn_app:app
      --bind 0.0.0.0:8000
      --worker-class aiohttp.GunicornWebWorker
      --workers 1
    networks:
      - dbnet
    volumes:
      - ./:/app/www/photo-contest
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  adminer:
    image: adminer
    container_name: pc-adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - dbnet
    depends_on:
      - postgres

  postgres:
    image: postgres:17.6
    container_name: pc-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dbnet

networks:
  dbnet:
    driver: bridge

volumes:
  postgres-data:
