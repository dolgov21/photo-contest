services:
  photo-contest:
    build: .
    image: photo-contest
    container_name: pc-aiohttp
    restart: always
    command: "python main.py"
    networks:
      - dbnet
    volumes:
      - ./:/app/www/photo-contest
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  adminer:
    image: adminer
    container_name: pc-adminer
    ports:
      - "8080:8080"
    networks:
      - dbnet
    depends_on:
      - postgres

  postgres:
    image: postgres:17.6
    container_name: pc-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dbnet

networks:
  dbnet:
    driver: bridge

volumes:
  postgres-data:
