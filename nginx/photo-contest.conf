server {
    listen 8080;
    charset utf8;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {    
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_buffering off;
        proxy_pass http://photo-contest:8000;
    }
}
